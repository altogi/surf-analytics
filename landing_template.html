<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf Analytics</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d2327; --muted: #6b7378; --line: #e3e0d8; --ride: #e8572a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #12171a; --card: #1b2226; --ink: #e9ecee; --muted: #9aa4aa; --line: #2b3439; --ride: #ff6d3f; }
  }
  :root[data-theme="dark"] { --bg: #12171a; --card: #1b2226; --ink: #e9ecee; --muted: #9aa4aa; --line: #2b3439; --ride: #ff6d3f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  a.loc { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
    color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.loc:hover { border-color: var(--ride); transform: translateY(-1px); }
  a.loc h2 { font-size: 18px; margin: 0 0 2px; }
  a.loc .dates { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Surf Analytics</h1>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
</main>
<script>
const L = /*__DATA__*/null;
const day = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const total = f => L.reduce((a, l) => a + l[f], 0);
document.getElementById('sub').textContent =
  `${L.length} location${L.length === 1 ? '' : 's'} · ${total('sessions')} sessions · ${total('waves')} waves caught`;
document.getElementById('grid').innerHTML = L.map(l => `
  <a class="loc" href="locations/${l.slug}/">
    <h2>${l.title}</h2>
    <div class="dates">${l.first === l.last ? day(l.first) : `${day(l.first)} – ${day(l.last)}`}</div>
    <div class="stats">
      <div><b>${l.sessions}</b><span>sessions</span></div>
      <div><b>${l.waves}</b><span>of ${l.attempted} caught</span></div>
      <div><b>${l.top_speed_ms.toFixed(2)}</b><span>max m/s</span></div>
    </div>
  </a>`).join('');
</script>
</body>
</html>
